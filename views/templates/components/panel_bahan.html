<div class="col-12 col-lg-6">
  <h2 class="fw-bold fs-5">Pilih Bahan</h2>
  <p class="text-muted small">Pilih bahan-bahan yang kamu miliki</p>

  <div class="mb-3">
    <div class="input-group">
      <span class="input-group-text bg-white border-end-0">
        <i class="bi bi-search"></i>
      </span>
      <input
        type="text"
        id="inputCariBahan"
        class="form-control border-start-0"
        placeholder="Cari bahan (misal: ayam, cabai...)"
        onkeyup="filterBahan()"
      />
    </div>
  </div>

  <div id="daftarBahan">
    <p class="text-muted small">Memuat bahan...</p>
  </div>
</div>
