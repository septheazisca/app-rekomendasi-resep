<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResepKu</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body class="bg-white">
    {% include 'components/navbar.html' %} {% include 'components/hero.html' %}
    {% include 'components/bahan_bar.html' %}

    <!-- ── Main Content ── -->
    <main class="container my-4">
      <div class="row g-4 align-items-start">
        {% include 'components/panel_bahan.html' %} {% include
        'components/panel_resep.html' %}
      </div>
    </main>

    {% include 'components/footer.html' %}

    <button id="btnTop" class="btn btn-success rounded-circle shadow">
      <i class="bi bi-chevron-up"></i>
    </button>

    <!-- Modal Scan Bahan -->
    <div
      class="modal fade"
      id="modalScan"
      tabindex="-1"
      aria-labelledby="modalScanLabel"
      aria-hidden="true"
      data-bs-backdrop="static"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 border-0 shadow">
          <div class="modal-header border-0 pb-0">
            <h5
              class="modal-title fw-bold"
              id="modalScanLabel"
              style="color: #0c3318"
            >
              Scan Bahan Makanan
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
              onclick="stopWebcam()"
            ></button>
          </div>
          <div class="modal-body text-center p-4">
            <!-- Tombol Aktifkan Kamera -->
            <button
              id="btnStartWebcam"
              onclick="initScan()"
              class="btn fw-bold w-100 mb-3"
              style="background-color: #00c53b; color: white"
            >
              Klik Untuk Aktifkan Kamera
            </button>

            <!-- Container Kamera -->
            <div
              id="webcam-container"
              class="mb-3 d-flex justify-content-center overflow-hidden rounded-3 bg-light"
              style="min-height: 250px"
            ></div>

            <!-- Label Hasil Scan -->
            <div
              id="label-container"
              class="fw-bold text-success mb-3"
              style="font-size: 1.1rem"
            ></div>
            <div id="scan-list" class="small text-muted mb-3">
              Bahan terdeteksi: <span id="list-bahan-scan">-</span>
            </div>

            <!-- Tombol Selesai -->
            <button
              onclick="terapkanHasilScan()"
              class="btn fw-bold w-100"
              style="background-color: #0c3318; color: white"
            >
              Selesai & Cari Resep
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!--ini bagian penambahan script Ai -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script>
      const btnTop = document.getElementById("btnTop");

      window.onscroll = function () {
        if (document.documentElement.scrollTop > 200) {
          btnTop.style.display = "block";
        } else {
          btnTop.style.display = "none";
        }
      };

      function scrollKeAtas() {
        window.scrollTo({
          top: 0,
          behavior: "smooth",
        });
      }
    </script>
  </body>
</html>
