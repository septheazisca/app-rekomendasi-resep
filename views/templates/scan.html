<!DOCTYPE html>

<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Scan Bahan</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="bg-white" style="font-family: 'Nunito', sans-serif;"></body>

<div class="container py-5 text-center">

  <h2 class="fw-bold mb-4" style="color:#0C3318;">
    Scan Bahan Makanan
  </h2>

  <div class="bg-white shadow rounded-4 p-4 mx-auto" style="max-width:400px;">

    <!-- tombol kamera -->
    <button onclick="init()" 
      class="btn fw-bold w-100 mb-3"
      style="background-color:#00C53B; color:white;">
      📷 Aktifkan Kamera
    </button>

    <!-- kamera -->
    <div id="webcam-container" class="mb-3"></div>

    <!-- hasil -->
    <div id="label-container" class="small text-muted mb-3"></div>

    <!-- tombol cari -->
    <button onclick="simpanHasil()" 
      class="btn fw-bold w-100"
      style="background-color:#00C53B; color:white;">
      Cari Resep
    </button>

  </div>

</div>
  <!-- LIBRARY -->

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

  <!-- SCRIPT -->

  <script>
    console.log("JS KELOAD ✅");

    const URL = "https://teachablemachine.withgoogle.com/models/4GCdHJwhO/";

    let model, webcam;
    let hasilScan = [];
    let counter = {};
    async function init() {
      console.log("INIT JALAN ✅");

      const modelURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";

      model = await tmImage.load(modelURL, metadataURL);

      webcam = new tmImage.Webcam(250, 250, true);
      await webcam.setup();
      await webcam.play();
      window.requestAnimationFrame(loop);

      document.getElementById("webcam-container").appendChild(webcam.canvas);
    }

    async function loop() {
      webcam.update();
      await predict();
      window.requestAnimationFrame(loop);
    }

    async function predict() {
  const prediction = await model.predict(webcam.canvas);

  let tertinggi = prediction.reduce((a, b) =>
    a.probability > b.probability ? a : b
  );

  let nama = tertinggi.className.toLowerCase();

  // 🔥 inisialisasi counter
  if (!counter[nama]) {
    counter[nama] = 0;
  }

  // 🔥 hanya hitung kalau yakin
  if (tertinggi.probability > 0.97) {
    counter[nama]++;
  }

  // 🔥 baru dianggap valid kalau muncul berkali-kali
  if (counter[nama] >= 10 && !hasilScan.includes(nama)) {
    hasilScan.push(nama);
    console.log("Ditambahkan (VALID):", nama);
  }

  // tampilkan ke layar
  document.getElementById("label-container").innerHTML =
    tertinggi.className + " (" + tertinggi.probability.toFixed(2) + ")";
}

    function simpanHasil() {
      localStorage.setItem("hasilScan", JSON.stringify(hasilScan));
      window.location.href = "/";
    }
  </script>

</body>
</html>
